name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'bike-navigator.html'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Keeps the same debug signing key between builds, so a new APK installs over the old one.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: node prep.js

      - name: Create Android project
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BikeNavigator-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as the "latest" release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk BikeNavigator.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest BikeNavigator.apk \
            --target "${{ github.sha }}" \
            --title "Bike Navigator - build ${{ github.run_number }}" \
            --notes "Android APK built automatically from the latest version. Download BikeNavigator.apk on your phone and open it to install."
